  <text x="60" y="100" font-family="Arial" font-size="18" fill="#475569">Esquema educativo. Dimensiones y resultados se consultan desde el Excel.</text>
  <g stroke="#1f4e78" stroke-width="18" fill="none" stroke-linecap="round">
